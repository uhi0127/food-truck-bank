<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>푸드트럭 계좌번호 복사</title>
  <link rel="stylesheet" href="style.css">

  <!-- 파비콘 및 애플 아이콘 설정 -->
  <link rel="icon" href="./favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">

  <!-- PWA 관련 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  
  <!-- iOS(아이폰) 대응 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="계좌복사">
</head>
<body>

  <div class="container">
    <h1>계좌번호 복사하기</h1>
    <p class="desc">아래 버튼을 눌러 간편하게 계좌번호를 복사하세요.</p>
    
    <!-- 계좌 정보 영역 (은행, 계좌번호, 예금주 분리) -->
    <div class="account-box">
      <div class="bank-name">국민은행</div>
      <div class="account-number-wrapper">
        <span id="targetText">123-456-789012</span>
      </div>
      <div class="account-holder">예금주: 유흥일</div>
    </div>
    
    <button id="copyBtn">계좌번호 복사하기</button>
    
    <div id="toast" class="toast">계좌번호가 복사되었습니다!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
