<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>푸드트럭 계좌번호 복사</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA 관련 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- iOS(아이폰) 대응 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="계좌복사">
</head>
<body>

  <div class="container">
    <h1>계좌번호 복사하기</h1>
    <p class="desc">아래 버튼을 눌러 간편하게 계좌번호를 복사하세요.</p>
    
    <!-- 복사할 계좌번호 텍스트 (이 부분만 본인 계좌로 수정하세요) -->
    <div class="account-box">
      <span id="targetText">국민은행 123-456-789012 (예금주: 유흥일)</span>
    </div>
    
    <button id="copyBtn">계좌번호 복사하기</button>
    
    <div id="toast" class="toast">클립보드에 복사되었습니다!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
